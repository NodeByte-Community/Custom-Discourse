name: Build and Push Custom Discourse Image

on:
  push:
    branches:
      - main
    paths:
      - 'containers/app.yml'
      - 'templates/**'
      - 'image/**'
      - 'launcher'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuild even if no changes detected'
        required: false
        default: 'false'

concurrency:
  group: build-discourse-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Docker image names must be lowercase
  IMAGE_NAME: cshdotcom/custom-discourse
  BUILDKIT_PROGRESS: plain

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download launcher binary
        run: |
          BINDIR="bin"
          mkdir -p ${BINDIR}
          package="${BINDIR}/launcher.tar.gz"
          echo "Downloading launcher binary..."
          curl -sL -o ${package} https://github.com/discourse/launcher/releases/download/v2.5.0/launcher-linux-amd64.tar.gz
          if [ ! -f ${package} ] || [ $(stat -c%s ${package}) -lt 1000000 ]; then
            echo "ERROR: Launcher download failed or file too small"
            ls -la ${package} || echo "File not found"
            exit 1
          fi
          tar -zxf ${package} -C ${BINDIR}
          rm ${package}
          chmod +x bin/launcher
          ls -la bin/
          echo "Launcher version: $(bin/launcher --version 2>&1 || echo 'unknown')"

      - name: Prepare real configuration from secrets
        env:
          APP_YML_BASE64: ${{ secrets.APP_YML_BASE64 }}
        run: |
          # The real app.yml with all credentials is stored as a GitHub Secret,
          # base64-encoded to handle multiline content properly.
          #
          # IMPORTANT: For CI builds, we must adapt the China-specific configuration
          # because GitHub proxy mirrors (gh-proxy.org, mirror.ghproxy.com) don't work
          # reliably from GitHub Actions runners. We:
          #   1. Remove web.china.template.yml (gem/npm mirrors not needed in CI)
          #   2. Replace v4.gh-proxy.org URLs with direct github.com URLs
          #   3. Remove git URL rewrite for proxy
          #
          # WARNING: Never commit the real app.yml to the public repository!
          
          if [ -z "$APP_YML_BASE64" ]; then
            echo "ERROR: APP_YML_BASE64 secret is not set!"
            echo "Please set it in GitHub repository settings:"
            echo "  Settings > Secrets and variables > Actions > New repository secret"
            echo "  Name: APP_YML_BASE64"
            echo "  Value: base64-encoded content of your real app.yml"
            echo ""
            echo "To create the base64 value, run on your local machine:"
            echo "  base64 -w0 your_real_app.yml"
            exit 1
          fi
          
          echo "$APP_YML_BASE64" | base64 -d > containers/app.yml
          
          # Adapt configuration for CI environment:
          # Remove China template (GitHub Actions runners don't need proxy mirrors)
          sed -i '/web\.china\.template\.yml/d' containers/app.yml
          
          # Replace GitHub proxy URLs with direct URLs
          # (v4.gh-proxy.org/https://github.com/ -> https://github.com/)
          sed -i 's|https://v4\.gh-proxy\.org/https://github\.com/|https://github.com/|g' containers/app.yml
          sed -i 's|https://mirror\.ghproxy\.com/https://github\.com/|https://github.com/|g' containers/app.yml
          
          # Remove git URL rewrite from hooks (if present from China template)
          # This would be in the before_code hook section
          sed -i '/git config --global url.*insteadOf/d' containers/app.yml
          
          # Verify the real config was written
          if grep -q "YOUR_" containers/app.yml; then
            echo "WARNING: Real app.yml still contains some YOUR_ placeholders."
            echo "Placeholder lines found:"
            grep "YOUR_" containers/app.yml || true
          fi
          
          # Verify critical fields are set
          if grep -q "DISCOURSE_HOSTNAME: discourse.example.com" containers/app.yml; then
            echo "ERROR: DISCOURSE_HOSTNAME is still set to the default placeholder!"
            exit 1
          fi
          
          echo "Real configuration prepared successfully (adapted for CI)."

      - name: Build Discourse image
        run: |
          echo "Building Discourse image..."
          echo "Image tag: ${REGISTRY}/${IMAGE_NAME}:latest"
          
          bin/launcher build app \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --output=type=registry \
            --metadata-file=/tmp/out.json

      - name: Restore placeholder app.yml (security)
        if: always()
        run: |
          # Always restore the placeholder version so secrets never leak into the repo
          git checkout containers/app.yml || true
          echo "Placeholder app.yml restored - no secrets in repository."

      - name: Save image digest
        id: metadata
        if: always()
        run: |
          if [ -f /tmp/out.json ]; then
            digest=$(jq -r '."containerimage.digest"' /tmp/out.json)
            echo "digest=$digest"
            echo "digest=$digest" >> $GITHUB_OUTPUT
          fi

      - name: Build summary
        if: always()
        run: |
          echo "## Build Result" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/out.json ]; then
            echo "Image pushed to: ${REGISTRY}/${IMAGE_NAME}:latest" >> $GITHUB_STEP_SUMMARY
            echo "Digest: $(jq -r '."containerimage.digest"' /tmp/out.json)" >> $GITHUB_STEP_SUMMARY
          else
            echo "Build may have failed. Check logs above." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Security Note" >> $GITHUB_STEP_SUMMARY
          echo "The placeholder app.yml has been restored. No secrets are stored in the repository." >> $GITHUB_STEP_SUMMARY
