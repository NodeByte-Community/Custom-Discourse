version: "3.8"

# ===========================================================
# Custom Discourse - One-Click Deployment via Docker Compose
# ===========================================================
#
# IMPORTANT: This docker-compose.yml uses environment variables
# for all sensitive configuration. Create a .env file in the
# same directory with your actual values before running.
#
# The pre-built image does NOT contain any sensitive information.
# All credentials are injected at runtime via environment variables.
#
# Usage:
#   1. Create .env file (see .env.example below)
#   2. docker compose up -d
#   3. Access Discourse at http://localhost:${DISCOURSE_PORT}
#
# ===========================================================

services:
  discourse:
    image: ghcr.io/nodebyte-community/custom-discourse:latest  # Private GHCR package - requires auth
    container_name: discourse_app
    restart: always
    shm_size: 512m
    mac_address: "02:42:ac:11:00:02"
    hostname: "${DISCOURSE_HOSTNAME:-discourse}"
    environment:
      - LC_ALL=en_US.UTF-8
      - LANG=en_US.UTF-8
      - UNICORN_WORKERS=${UNICORN_WORKERS:-4}
      - DISCOURSE_HOSTNAME=${DISCOURSE_HOSTNAME}
      - DISCOURSE_DEVELOPER_EMAILS=${DISCOURSE_DEVELOPER_EMAILS}
      - DISCOURSE_SMTP_ADDRESS=${DISCOURSE_SMTP_ADDRESS}
      - DISCOURSE_SMTP_PORT=${DISCOURSE_SMTP_PORT:-587}
      - DISCOURSE_SMTP_USER_NAME=${DISCOURSE_SMTP_USER_NAME}
      - DISCOURSE_SMTP_PASSWORD=${DISCOURSE_SMTP_PASSWORD}
      - DISCOURSE_SMTP_ENABLE_START_TLS=${DISCOURSE_SMTP_ENABLE_START_TLS:-true}
      - DISCOURSE_SMTP_OPENSSL_VERIFY_MODE=${DISCOURSE_SMTP_OPENSSL_VERIFY_MODE:-none}
      - DOCKER_HOST_IP=172.17.0.1
    ports:
      - "${DISCOURSE_PORT:-80}:80"
    volumes:
      - discourse_shared:/shared
      - discourse_log:/var/log
      - discourse_maxmind:/var/www/discourse/vendor/data

volumes:
  discourse_shared:
    driver: local
  discourse_log:
    driver: local
  discourse_maxmind:
    driver: local

# ===========================================================
# .env.example - Create a .env file with your values:
# ===========================================================
#
# DISCOURSE_HOSTNAME=your-domain.com
# DISCOURSE_DEVELOPER_EMAILS=admin@your-domain.com
# DISCOURSE_SMTP_ADDRESS=smtp.your-provider.com
# DISCOURSE_SMTP_PORT=587
# DISCOURSE_SMTP_USER_NAME=smtp-user@your-domain.com
# DISCOURSE_SMTP_PASSWORD=your-smtp-password
# DISCOURSE_SMTP_ENABLE_START_TLS=true
# DISCOURSE_SMTP_OPENSSL_VERIFY_MODE=none
# UNICORN_WORKERS=4
# DISCOURSE_PORT=80
