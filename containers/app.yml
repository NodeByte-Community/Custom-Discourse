## This is the all-in-one, standalone Discourse Docker container template
## Customized for NodeByte Community deployment
##
## After making changes to this file, you MUST rebuild the container:
##   ./launcher rebuild app
##
## BE *VERY* CAREFUL WHEN EDITING!
## YAML FILES ARE SUPER SUPER SENSITIVE TO MISTAKES IN WHITESPACE OR ALIGNMENT!
## visit http://www.yamllint.com/ to validate this file as needed
##
## IMPORTANT: All sensitive values have been replaced with placeholders.
## Replace all YOUR_* placeholders with your actual values before building.
## Alternatively, use the provided docker-compose.yml for one-click deployment.

docker_args:
  --dns=YOUR_DNS_PRIMARY
  --dns=YOUR_DNS_SECONDARY

templates:
  - "templates/postgres.template.yml"
  - "templates/redis.template.yml"
  - "templates/web.template.yml"
  - "templates/web.ratelimited.template.yml"
  # Uncomment the following if deploying in China (uses mirrors for faster downloads)
  # - "templates/web.china.template.yml"
  # Uncomment if using Cloudflare as reverse proxy
  # - "templates/cloudflare.template.yml"

expose:
  - "YOUR_PORT:80"  # e.g., "80:80" for HTTP or "443:80" behind SSL proxy

params:
  db_shared_buffers: "256MB"

env:
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8
  UNICORN_WORKERS: 4
  ## Required: Your Discourse domain name
  DISCOURSE_HOSTNAME: YOUR_DISCOURSE_HOSTNAME
  ## Required: Admin/developer email addresses (comma-separated)
  DISCOURSE_DEVELOPER_EMAILS: YOUR_ADMIN_EMAILS
  ## Required: SMTP mail server configuration
  DISCOURSE_SMTP_ADDRESS: YOUR_SMTP_SERVER
  DISCOURSE_SMTP_PORT: 587
  DISCOURSE_SMTP_USER_NAME: YOUR_SMTP_USERNAME
  DISCOURSE_SMTP_PASSWORD: "YOUR_SMTP_PASSWORD"
  DISCOURSE_SMTP_ENABLE_START_TLS: true
  DISCOURSE_SMTP_OPENSSL_VERIFY_MODE: none

# Data persistence volumes
volumes:
  - volume:
      host: /var/discourse/shared/standalone
      guest: /shared
  - volume:
      host: /var/discourse/shared/standalone/maxmind
      guest: /var/www/discourse/vendor/data

hooks:
  after_code:
    - exec:
        cd: $home/plugins
        cmd:
          # Uncomment and customize the plugins you need
          # Note: discourse-solved is now bundled with Discourse and should NOT be listed here
          - git clone https://github.com/discourse/docker_manager.git
          # - git clone https://github.com/discourse/discourse-saved-searches.git
          # - git clone https://github.com/discourse/discourse-category-experts.git
          # - git clone https://github.com/discourse/discourse-bbcode.git
          # - git clone https://github.com/discourse/discourse-yearly-review.git
          # - git clone https://github.com/discourse/discourse-doc-categories.git
          # - git clone https://github.com/discourse/discourse-signatures.git

